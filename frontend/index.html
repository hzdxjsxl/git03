<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音频情绪识别系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                        <line x1="12" y1="19" x2="12" y2="23"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <h1>EmoVoice</h1>
                    <p>音频情绪识别系统</p>
                </div>
            </div>
            <div class="status-badge" id="statusBadge">
                <span class="status-dot"></span>
                <span class="status-text">准备就绪</span>
            </div>
        </header>

        <main class="main-content">
            <section class="recording-section">
                <div class="waveform-container">
                    <canvas id="waveformCanvas"></canvas>
                    <div class="waveform-grid"></div>
                    <div class="waveform-label" id="waveformLabel">
                        <span class="label-icon">📊</span>
                        <span class="label-text">音频波形</span>
                    </div>
                </div>

                <div class="controls-container">
                    <div class="timer-display" id="timerDisplay">00:00</div>

                    <button class="record-btn" id="recordBtn" aria-label="开始录音">
                        <span class="record-ring"></span>
                        <span class="record-inner">
                            <svg class="mic-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
                            </svg>
                            <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="6" width="12" height="12" rx="2"/>
                            </svg>
                        </span>
                    </button>

                    <div class="button-row">
                        <button class="secondary-btn" id="playbackBtn" disabled>
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="8 5 19 12 8 19 8 5"/>
                            </svg>
                            <span>回放</span>
                        </button>
                        <button class="secondary-btn" id="analyzeBtn" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 11l3 3L22 4"/>
                                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                            </svg>
                            <span>分析情绪</span>
                        </button>
                    </div>
                </div>

                <div class="hint-text" id="hintText">
                    点击麦克风按钮开始录音，建议录制 2-5 秒的语音
                </div>
            </section>

            <section class="results-section" id="resultsSection">
                <div class="section-header">
                    <h2>情绪分析结果</h2>
                    <span class="analyze-time" id="analyzeTime"></span>
                </div>

                <div class="dominant-emotion" id="dominantEmotion">
                    <div class="emoji-display">🎯</div>
                    <div class="emotion-name">等待分析</div>
                    <div class="confidence-value">--%</div>
                </div>

                <div class="emotion-cards">
                    <div class="emotion-card angry" data-emotion="0">
                        <div class="emotion-header">
                            <span class="emotion-emoji">😠</span>
                            <span class="emotion-label">愤怒</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 0%"></div>
                            <div class="progress-glow"></div>
                        </div>
                        <div class="emotion-percent">0%</div>
                    </div>

                    <div class="emotion-card happy" data-emotion="1">
                        <div class="emotion-header">
                            <span class="emotion-emoji">😊</span>
                            <span class="emotion-label">开心</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 0%"></div>
                            <div class="progress-glow"></div>
                        </div>
                        <div class="emotion-percent">0%</div>
                    </div>

                    <div class="emotion-card sad" data-emotion="2">
                        <div class="emotion-header">
                            <span class="emotion-emoji">😢</span>
                            <span class="emotion-label">悲伤</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: 0%"></div>
                            <div class="progress-glow"></div>
                        </div>
                        <div class="emotion-percent">0%</div>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="footer-info">
                <span class="info-item">
                    <span class="info-icon">🎙️</span>
                    16kHz 采样率
                </span>
                <span class="info-item">
                    <span class="info-icon">🔊</span>
                    单声道
                </span>
                <span class="info-item">
                    <span class="info-icon">🧠</span>
                    CNN 模型
                </span>
            </div>
            <div class="footer-copyright">
                EmoVoice &copy; 2024 | 实时音频情绪分析
            </div>
        </footer>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="audio-wave">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <p>正在分析音频情绪...</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
