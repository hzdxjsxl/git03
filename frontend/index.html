<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑白棋 AI 对弈 - MCTS 蒙特卡洛树搜索</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>黑白棋 AI 对弈</h1>
        <p class="subtitle">纯手写 MCTS 蒙特卡洛树搜索算法</p>

        <div class="game-info">
            <div class="player-info black">
                <div class="piece black-piece"></div>
                <span>玩家 (黑棋)</span>
                <span class="score" id="black-score">2</span>
            </div>
            <div class="status">
                <div id="game-status">轮到你下棋</div>
                <div id="ai-thinking" class="hidden">AI 思考中...</div>
            </div>
            <div class="player-info white">
                <div class="piece white-piece"></div>
                <span>AI (白棋)</span>
                <span class="score" id="white-score">2</span>
            </div>
        </div>

        <div class="board-container">
            <div id="board" class="board"></div>
        </div>

        <div class="controls">
            <button id="reset-btn" class="btn">重新开始</button>
            <div class="ai-info">
                <span>模拟次数: <span id="sim-count">0</span></span>
                <span>考虑走法: <span id="move-count">0</span></span>
            </div>
        </div>

        <div id="game-over" class="game-over hidden">
            <div class="game-over-content">
                <h2 id="winner-text">游戏结束</h2>
                <p id="final-score">最终比分</p>
                <button id="play-again-btn" class="btn">再来一局</button>
            </div>
        </div>

        <div class="algorithm-info">
            <h3>算法说明</h3>
            <p>本AI使用纯手写的<strong>蒙特卡洛树搜索(MCTS)</strong>算法，包含四个核心阶段：</p>
            <ol>
                <li><strong>选择(Selection)</strong>：使用置信上限公式(UCB)选择最优节点</li>
                <li><strong>扩展(Expansion)</strong>：为选中节点添加一个或多个子节点</li>
                <li><strong>模拟(Simulation)</strong>：从新节点开始随机模拟对弈直到结束</li>
                <li><strong>反向传播(Backpropagation)</strong>：将模拟结果反向更新到所有祖先节点</li>
            </ol>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
