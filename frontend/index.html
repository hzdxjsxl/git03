<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工业流水线零件表面缺陷视觉检测平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1 class="title">
                <span class="title-icon">🔍</span>
                工业流水线零件表面缺陷视觉检测平台
            </h1>
            <div class="header-status">
                <span id="modelStatus" class="status-badge status-loading">模型加载中...</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <section class="control-panel">
            <div class="panel-card">
                <h2 class="panel-title">图像上传</h2>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept="image/*" hidden>
                    <div class="upload-icon">📷</div>
                    <p class="upload-text">点击或拖拽图片到此处上传</p>
                    <p class="upload-hint">支持 PNG、JPG、BMP、TIFF 格式，最大 16MB</p>
                </div>
            </div>

            <div class="panel-card">
                <h2 class="panel-title">检测参数</h2>
                <div class="form-group">
                    <label for="thresholdSlider">置信度阈值</label>
                    <div class="slider-row">
                        <input type="range" id="thresholdSlider" min="0.1" max="0.99" step="0.01" value="0.5">
                        <span id="thresholdValue" class="slider-value">0.50</span>
                    </div>
                </div>
                <button id="detectBtn" class="btn btn-primary btn-block" disabled>
                    <span class="btn-icon">⚡</span>
                    开始检测
                </button>
                <button id="resetBtn" class="btn btn-secondary btn-block">
                    <span class="btn-icon">🔄</span>
                    重置
                </button>
            </div>

            <div class="panel-card">
                <h2 class="panel-title">检测结果统计</h2>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="totalDefects">0</div>
                        <div class="stat-label">缺陷总数</div>
                    </div>
                    <div class="stat-item stat-warning" id="warningStat">
                        <div class="stat-value" id="highConfidence">0</div>
                        <div class="stat-label">高置信度</div>
                    </div>
                </div>
                <div class="result-banner" id="resultBanner" style="display:none;">
                    <span id="resultBannerText"></span>
                </div>
            </div>
        </section>

        <section class="display-panel">
            <div class="display-card">
                <div class="card-header">
                    <h2 class="panel-title">检测图像</h2>
                    <div class="card-actions">
                        <label class="toggle-label">
                            <input type="checkbox" id="showBoxes" checked>
                            <span>显示检测框</span>
                        </label>
                        <label class="toggle-label">
                            <input type="checkbox" id="showLabels" checked>
                            <span>显示标签</span>
                        </label>
                    </div>
                </div>
                <div class="image-container" id="imageContainer">
                    <div class="image-placeholder" id="imagePlaceholder">
                        <span>暂无图像</span>
                    </div>
                    <canvas id="displayCanvas" style="display:none;"></canvas>
                </div>
                <div class="image-info" id="imageInfo" style="display:none;">
                    <span id="imageSize">-</span>
                </div>
            </div>
        </section>

        <aside class="detail-panel">
            <div class="panel-card">
                <h2 class="panel-title">缺陷详情</h2>
                <div class="defect-list" id="defectList">
                    <div class="empty-state">
                        <p>暂无检测结果</p>
                    </div>
                </div>
            </div>

            <div class="panel-card">
                <h2 class="panel-title">缺陷裁剪预览</h2>
                <div class="crop-preview" id="cropPreview">
                    <div class="empty-state">
                        <p>选择缺陷查看裁剪图</p>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <script src="js/api.js"></script>
    <script src="js/annotator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
