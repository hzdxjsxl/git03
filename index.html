<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体素世界 - Voxel World</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: monospace;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">
        <div>位置: <span id="pos">0, 0, 0</span></div>
        <div>区块: <span id="chunk">0, 0</span></div>
        <div>面数: <span id="faces">0</span></div>
        <div>帧率: <span id="fps">0</span></div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
