<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微型深度学习框架 - 计算图可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 20px;
        }
        
        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .panel-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .stats {
            margin-top: 20px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .stat-label {
            color: #aaa;
        }
        
        .stat-value {
            color: #00d2ff;
            font-weight: bold;
        }
        
        .canvas-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        #graphCanvas {
            width: 100%;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .node-legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.85rem;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .legend-color.input { background: #00ff88; }
        .legend-color.param { background: #ff6b6b; }
        .legend-color.op { background: #ffd93d; }
        .legend-color.output { background: #6bcb77; }
        
        .node-info {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 10px;
            pointer-events: none;
            z-index: 100;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
        
        .info-row {
            margin: 5px 0;
        }
        
        .info-label {
            color: #aaa;
            margin-right: 10px;
        }
        
        .info-value {
            color: #00d2ff;
        }
        
        .training-log {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #logArea {
            height: 200px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        #logArea::-webkit-scrollbar {
            width: 6px;
        }
        
        #logArea::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        
        #logArea::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.5);
            border-radius: 3px;
        }
        
        .highlighted {
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.5);
            }
        }
        
        .loss-chart {
            margin-top: 20px;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        
        .chart-title {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>微型深度学习框架</h1>
            <p class="subtitle">纯手工实现的计算图与反向传播</p>
        </header>
        
        <div class="main-content">
            <div class="control-panel">
                <div class="panel-title">训练控制</div>
                <button class="btn-primary" onclick="startTraining()">开始训练</button>
                <button class="btn-secondary" onclick="resetGraph()">重置图</button>
                <button class="btn-secondary" onclick="highlightNodes()">高亮节点</button>
                
                <div class="stats">
                    <div class="panel-title">训练统计</div>
                    <div class="stat-item">
                        <span class="stat-label">当前轮次</span>
                        <span class="stat-value" id="epoch">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">当前损失</span>
                        <span class="stat-value" id="loss">0.0000</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">节点数</span>
                        <span class="stat-value" id="nodeCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">边数</span>
                        <span class="stat-value" id="edgeCount">0</span>
                    </div>
                </div>
            </div>
            
            <div class="canvas-container">
                <canvas id="graphCanvas" width="900" height="500"></canvas>
                
                <div class="node-legend">
                    <div class="legend-item">
                        <div class="legend-color input"></div>
                        <span>输入节点</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color param"></div>
                        <span>参数节点</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color op"></div>
                        <span>运算节点</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color output"></div>
                        <span>输出节点</span>
                    </div>
                </div>
                
                <div class="node-info" id="nodeInfo" style="display: none;">
                    <div class="info-row">
                        <span class="info-label">标签:</span>
                        <span class="info-value" id="infoLabel"></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">数据:</span>
                        <span class="info-value" id="infoData"></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">梯度:</span>
                        <span class="info-value" id="infoGrad"></span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">运算:</span>
                        <span class="info-value" id="infoOp"></span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="training-log">
            <div class="panel-title">训练日志</div>
            <div id="logArea"></div>
            
            <div class="loss-chart">
                <div class="chart-title">损失变化曲线</div>
                <canvas id="lossChart" width="800" height="160"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const nodeInfo = document.getElementById('nodeInfo');
        const logArea = document.getElementById('logArea');
        const lossChart = document.getElementById('lossChart');
        const lossCtx = lossChart.getContext('2d');
        
        let graphData = null;
        let nodes = [];
        let edges = [];
        let highlightedNodeIds = new Set();
        let losses = [];
        let animationId = null;
        
        const colors = {
            input: '#00ff88',
            param: '#ff6b6b',
            op: '#ffd93d',
            output: '#6bcb77',
            edge: 'rgba(255, 255, 255, 0.3)'
        };
        
        function getNodeColor(node) {
            if (node.label.startsWith('x')) return colors.input;
            if (node.label.startsWith('L') && (node.label.includes('.w') || node.label.includes('.b'))) return colors.param;
            if (node.label === 'avg_loss' || node.label.startsWith('loss')) return colors.output;
            return colors.op;
        }
        
        function layoutGraph() {
            if (!graphData) return;
            
            nodes = graphData.nodes.map((node, index) => {
                const layer = determineLayer(node);
                const layerWidth = canvas.width / 6;
                const layerHeight = canvas.height / 8;
                
                const x = layer * layerWidth + 80;
                const y = (index % 8) * layerHeight + 60;
                
                return {
                    ...node,
                    x: x + (Math.random() - 0.5) * 40,
                    y: y + (Math.random() - 0.5) * 40,
                    vx: 0,
                    vy: 0
                };
            });
            
            edges = graphData.edges;
        }
        
        function determineLayer(node) {
            if (node.label.startsWith('x')) return 0;
            if (node.label.startsWith('L1')) return 1;
            if (node.label.startsWith('L2')) return 3;
            if (node.label.includes('loss') || node.label === 'avg_loss') return 5;
            return 2;
        }
        
        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            edges.forEach(edge => {
                const fromNode = nodes.find(n => n.id === edge.from);
                const toNode = nodes.find(n => n.id === edge.to);
                
                if (fromNode && toNode) {
                    ctx.beginPath();
                    ctx.moveTo(fromNode.x + 20, fromNode.y);
                    ctx.lineTo(toNode.x - 20, toNode.y);
                    ctx.strokeStyle = colors.edge;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    
                    ctx.beginPath();
                    const angle = Math.atan2(toNode.y - fromNode.y, toNode.x - fromNode.x);
                    const arrowLength = 8;
                    ctx.moveTo(toNode.x - 20, toNode.y);
                    ctx.lineTo(
                        toNode.x - 20 - arrowLength * Math.cos(angle - Math.PI / 6),
                        toNode.y - arrowLength * Math.sin(angle - Math.PI / 6)
                    );
                    ctx.moveTo(toNode.x - 20, toNode.y);
                    ctx.lineTo(
                        toNode.x - 20 - arrowLength * Math.cos(angle + Math.PI / 6),
                        toNode.y - arrowLength * Math.sin(angle + Math.PI / 6)
                    );
                    ctx.strokeStyle = colors.edge;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
            
            nodes.forEach(node => {
                const color = getNodeColor(node);
                const isHighlighted = highlightedNodeIds.has(node.id);
                
                if (isHighlighted) {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 30, 0, Math.PI * 2);
                    ctx.fillStyle = color + '40';
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 25, 0, Math.PI * 2);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                
                ctx.beginPath();
                ctx.arc(node.x, node.y, 18, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let displayText = '';
                if (node.label) {
                    displayText = node.label.length > 8 ? node.label.substring(0, 8) + '..' : node.label;
                } else if (node.op) {
                    displayText = node.op;
                }
                
                ctx.fillText(displayText, node.x, node.y);
            });
            
            animationId = requestAnimationFrame(drawGraph);
        }
        
        function showNodeInfo(node, event) {
            nodeInfo.style.display = 'block';
            nodeInfo.style.left = event.clientX + 15 + 'px';
            nodeInfo.style.top = event.clientY + 15 + 'px';
            
            document.getElementById('infoLabel').textContent = node.label || '无标签';
            document.getElementById('infoData').textContent = node.data !== undefined ? node.data.toFixed(4) : 'N/A';
            document.getElementById('infoGrad').textContent = node.grad !== undefined ? node.grad.toFixed(4) : 'N/A';
            document.getElementById('infoOp').textContent = node.op || '无';
        }
        
        function hideNodeInfo() {
            nodeInfo.style.display = 'none';
        }
        
        function highlightNodes() {
            highlightedNodeIds.clear();
            
            const sortedNodes = [...nodes].sort((a, b) => Math.abs(b.grad || 0) - Math.abs(a.grad || 0));
            const topNodes = sortedNodes.slice(0, 5);
            
            topNodes.forEach(node => {
                highlightedNodeIds.add(node.id);
            });
            
            addLog(`高亮显示梯度最大的5个节点`);
        }
        
        function resetGraph() {
            highlightedNodeIds.clear();
            graphData = null;
            nodes = [];
            edges = [];
            losses = [];
            
            document.getElementById('epoch').textContent = '0';
            document.getElementById('loss').textContent = '0.0000';
            document.getElementById('nodeCount').textContent = '0';
            document.getElementById('edgeCount').textContent = '0';
            
            logArea.innerHTML = '';
            drawLossChart();
        }
        
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            logArea.innerHTML += `[${timestamp}] ${message}\n`;
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        function drawLossChart() {
            lossCtx.clearRect(0, 0, lossChart.width, lossChart.height);
            
            if (losses.length < 2) return;
            
            const maxLoss = Math.max(...losses);
            const minLoss = Math.min(...losses);
            const range = maxLoss - minLoss || 1;
            
            lossCtx.beginPath();
            lossCtx.strokeStyle = '#00d2ff';
            lossCtx.lineWidth = 2;
            
            losses.forEach((loss, index) => {
                const x = (index / (losses.length - 1)) * lossChart.width;
                const y = lossChart.height - ((loss - minLoss) / range) * (lossChart.height - 20) - 10;
                
                if (index === 0) {
                    lossCtx.moveTo(x, y);
                } else {
                    lossCtx.lineTo(x, y);
                }
            });
            
            lossCtx.stroke();
            
            lossCtx.beginPath();
            lossCtx.strokeStyle = '#ff6b6b';
            lossCtx.lineWidth = 2;
            
            const lastPoint = losses.length - 1;
            const lastX = (lastPoint / (losses.length - 1)) * lossChart.width;
            const lastY = lossChart.height - ((losses[lastPoint] - minLoss) / range) * (lossChart.height - 20) - 10;
            lossCtx.arc(lastX, lastY, 5, 0, Math.PI * 2);
            lossCtx.stroke();
        }
        
        async function startTraining() {
            addLog('开始训练异或门网络...');
            
            const response = await fetch('/train', { method: 'POST' });
            const result = await response.json();
            
            graphData = result.graphData;
            losses = result.losses;
            
            layoutGraph();
            
            document.getElementById('nodeCount').textContent = nodes.length;
            document.getElementById('edgeCount').textContent = edges.length;
            
            for (let i = 0; i < losses.length; i += 100) {
                document.getElementById('epoch').textContent = i + 100;
                document.getElementById('loss').textContent = losses[i].toFixed(4);
                drawLossChart();
                await new Promise(resolve => setTimeout(resolve, 10));
            }
            
            addLog('训练完成!');
            addLog(`最终损失: ${losses[losses.length - 1].toFixed(6)}`);
            addLog(`节点数: ${nodes.length}`);
            
            highlightNodes();
        }
        
        canvas.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            for (const node of nodes) {
                const distance = Math.sqrt((node.x - x) ** 2 + (node.y - y) ** 2);
                if (distance < 20) {
                    showNodeInfo(node, event);
                    return;
                }
            }
            
            hideNodeInfo();
        });
        
        canvas.addEventListener('mouseleave', hideNodeInfo);
        
        window.addEventListener('load', () => {
            drawGraph();
        });
    </script>
</body>
</html>
