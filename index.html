<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微型深度学习框架 - 计算图可视化</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .main-content { display: grid; grid-template-columns: 1fr 3fr; gap: 20px; }
        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4); }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); }
        .stats { margin-top: 20px; }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .stat-value { color: #00d2ff; font-weight: bold; font-family: monospace; }
        .stat-value.loss { color: #ff6b6b; }
        .stat-value.error { color: #ff4757; }
        .canvas-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #graphCanvas {
            width: 100%;
            border-radius: 10px;
            background: #0a0a15;
            display: block;
        }
        #logArea {
            height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        #logArea::-webkit-scrollbar { width: 6px; }
        #logArea::-webkit-scrollbar-thumb { background: rgba(0, 210, 255, 0.5); border-radius: 3px; }
        .loss-chart {
            margin-top: 20px;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        #lossChart { width: 100%; height: 100%; }
        .node-info {
            position: fixed;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px;
            border-radius: 10px;
            pointer-events: none;
            z-index: 100;
            border: 1px solid #00d2ff;
            min-width: 200px;
        }
        .training-progress {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            transition: width 0.1s linear;
        }
        .connection-status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
        }
        .status-connected { background: rgba(0, 255, 136, 0.15); color: #00ff88; }
        .status-connecting { background: rgba(255, 217, 61, 0.15); color: #ffd93d; }
        .status-disconnected { background: rgba(255, 71, 87, 0.15); color: #ff4757; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>微型深度学习框架</h1>
            <p>纯手工实现的计算图与反向传播</p>
        </header>
        
        <div class="main-content">
            <div class="control-panel">
                <button class="btn-primary" id="startBtn" onclick="startTraining()">开始训练</button>
                <button class="btn-secondary" onclick="resetGraph()">重置</button>
                <button class="btn-secondary" onclick="highlightNodes()" id="highlightBtn" disabled>高亮节点</button>
                
                <div class="stats">
                    <div class="stat-item"><span>轮次</span><span class="stat-value" id="epoch">0</span></div>
                    <div class="stat-item"><span>损失</span><span class="stat-value loss" id="loss">0.0000</span></div>
                    <div class="stat-item"><span>节点</span><span class="stat-value" id="nodeCount">0</span></div>
                    <div class="stat-item"><span>边数</span><span class="stat-value" id="edgeCount">0</span></div>
                </div>
                
                <div class="training-progress">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                </div>
                
                <div class="connection-status" id="connStatus">未连接</div>
            </div>
            
            <div class="canvas-container">
                <canvas id="graphCanvas" width="900" height="500"></canvas>
                <div id="canvasHint" style="text-align: center; color: #666; padding-top: 200px; position: absolute; top: 20px; left: 20px; right: 20px;">
                    <div style="font-size: 1.2rem; margin-bottom: 10px;">点击「开始训练」按钮开始</div>
                    <div style="font-size: 0.9rem;">训练完成后将显示计算图</div>
                </div>
            </div>
        </div>
        
        <div style="margin-top: 20px;">
            <div id="logArea"></div>
            <div class="loss-chart">
                <canvas id="lossChart" width="800" height="160"></canvas>
            </div>
        </div>
        
        <div class="node-info" id="nodeInfo" style="display: none;">
            <div><strong>标签:</strong> <span id="infoLabel"></span></div>
            <div><strong>数据:</strong> <span id="infoData"></span></div>
            <div><strong>梯度:</strong> <span id="infoGrad"></span></div>
            <div><strong>运算:</strong> <span id="infoOp"></span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const lossChart = document.getElementById('lossChart');
        const lossCtx = lossChart.getContext('2d');
        
        let nodes = [];
        let edges = [];
        let highlightedNodeIds = new Set();
        let hoveredNodeId = null;
        let losses = [];
        let isTraining = false;
        let eventSource = null;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;
        
        const colors = {
            input: '#00ff88',
            param: '#ff6b6b',
            op: '#ffd93d',
            output: '#6bcb77',
            edge: 'rgba(255, 255, 255, 0.3)',
            edgeHighlighted: '#00d2ff'
        };
        
        function setConnectionStatus(status) {
            const el = document.getElementById('connStatus');
            el.textContent = {
                'connected': '已连接',
                'connecting': '连接中...',
                'disconnected': '已断开'
            }[status];
            el.className = 'connection-status status-' + status;
        }
        
        function getNodeColor(node) {
            if (node.label && node.label.startsWith('x')) return colors.input;
            if (node.label && node.label.startsWith('L') && (node.label.includes('.w') || node.label.includes('.b'))) return colors.param;
            if (node.label && (node.label === 'avg_loss' || node.label.startsWith('loss'))) return colors.output;
            return colors.op;
        }
        
        function layoutGraph(graphData) {
            if (!graphData || !graphData.nodes || !graphData.nodes.length) {
                addLog('错误: 计算图数据为空');
                return;
            }
            
            addLog(`加载计算图: ${graphData.nodes.length} 节点, ${graphData.edges?.length || 0} 边`);
            
            const layerMap = {};
            graphData.nodes.forEach(node => {
                const layer = determineLayer(node);
                if (!layerMap[layer]) layerMap[layer] = [];
                layerMap[layer].push(node);
            });
            
            nodes = [];
            const layerWidth = canvas.width / 6;
            
            Object.keys(layerMap).sort((a, b) => parseInt(a) - parseInt(b)).forEach(layer => {
                const layerNodes = layerMap[layer];
                const spacing = canvas.height / (layerNodes.length + 1);
                
                layerNodes.forEach((node, i) => {
                    nodes.push({
                        ...node,
                        x: parseInt(layer) * layerWidth + 100,
                        y: spacing * (i + 1)
                    });
                });
            });
            
            edges = graphData.edges || [];
            document.getElementById('canvasHint').style.display = 'none';
            
            addLog(`计算图布局完成: ${nodes.length} 节点已定位`);
        }
        
        function determineLayer(node) {
            if (!node.label) return 2;
            if (node.label.startsWith('x')) return 0;
            if (node.label.startsWith('L1')) return 1;
            if (node.label.startsWith('L2')) return 3;
            if (node.label.includes('loss') || node.label === 'avg_loss') return 5;
            return 2;
        }
        
        function isNodeHighlighted(nodeId) {
            return highlightedNodeIds.has(nodeId) || hoveredNodeId === nodeId;
        }
        
        function isEdgeHighlighted(edge) {
            if (!hoveredNodeId && highlightedNodeIds.size === 0) return false;
            if (hoveredNodeId) {
                return edge.from === hoveredNodeId || edge.to === hoveredNodeId;
            }
            return highlightedNodeIds.has(edge.from) || highlightedNodeIds.has(edge.to);
        }
        
        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            edges.forEach(edge => {
                const fromNode = nodes.find(n => n.id === edge.from);
                const toNode = nodes.find(n => n.id === edge.to);
                
                if (!fromNode || !toNode) return;
                
                const isHighlighted = isEdgeHighlighted(edge);
                
                ctx.beginPath();
                ctx.moveTo(fromNode.x, fromNode.y);
                ctx.lineTo(toNode.x, toNode.y);
                ctx.strokeStyle = isHighlighted ? colors.edgeHighlighted : colors.edge;
                ctx.lineWidth = isHighlighted ? 4 : 1;
                ctx.stroke();
            });
            
            nodes.forEach(node => {
                const color = getNodeColor(node);
                const isHighlighted = isNodeHighlighted(node.id);
                const radius = isHighlighted ? 22 : 15;
                
                if (isHighlighted) {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, radius + 15, 0, Math.PI * 2);
                    const gradient = ctx.createRadialGradient(node.x, node.y, radius, node.x, node.y, radius + 15);
                    gradient.addColorStop(0, color + '60');
                    gradient.addColorStop(1, color + '00');
                    ctx.fillStyle = gradient;
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, radius + 10, 0, Math.PI * 2);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                
                ctx.beginPath();
                ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
                if (isHighlighted) {
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 20;
                }
                ctx.fillStyle = color;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.beginPath();
                ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
                ctx.strokeStyle = isHighlighted ? '#fff' : 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = isHighlighted ? 3 : 2;
                ctx.stroke();
                
                ctx.fillStyle = '#000';
                ctx.font = `bold ${isHighlighted ? 11 : 9}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let displayText = '';
                if (node.label) {
                    displayText = node.label.length > 6 ? node.label.substring(0, 6) : node.label;
                } else if (node.op) {
                    displayText = node.op;
                }
                ctx.fillText(displayText, node.x, node.y);
            });
            
            requestAnimationFrame(drawGraph);
        }
        
        function highlightNodes() {
            if (!nodes.length) return;
            
            highlightedNodeIds.clear();
            
            const sortedNodes = [...nodes].sort((a, b) => Math.abs(b.grad || 0) - Math.abs(a.grad || 0));
            const topNodes = sortedNodes.slice(0, 5);
            
            topNodes.forEach(node => {
                highlightedNodeIds.add(node.id);
            });
            
            addLog(`高亮显示梯度最大的5个节点`);
        }
        
        function resetGraph() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            
            nodes = [];
            edges = [];
            losses = [];
            highlightedNodeIds.clear();
            hoveredNodeId = null;
            isTraining = false;
            reconnectAttempts = 0;
            
            document.getElementById('epoch').textContent = '0';
            document.getElementById('loss').textContent = '0.0000';
            document.getElementById('nodeCount').textContent = '0';
            document.getElementById('edgeCount').textContent = '0';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('highlightBtn').disabled = true;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('logArea').innerHTML = '';
            document.getElementById('canvasHint').style.display = 'block';
            setConnectionStatus('disconnected');
            
            drawLossChart();
        }
        
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            document.getElementById('logArea').innerHTML += `[${timestamp}] ${message}\n`;
            document.getElementById('logArea').scrollTop = document.getElementById('logArea').scrollHeight;
        }
        
        function drawLossChart() {
            lossCtx.clearRect(0, 0, lossChart.width, lossChart.height);
            
            if (losses.length < 2) return;
            
            const maxLoss = Math.max(...losses);
            const minLoss = Math.min(...losses);
            const range = maxLoss - minLoss || 1;
            
            lossCtx.beginPath();
            lossCtx.strokeStyle = '#00d2ff';
            lossCtx.lineWidth = 2;
            
            losses.forEach((loss, index) => {
                const x = (index / (losses.length - 1)) * lossChart.width;
                const y = lossChart.height - ((loss - minLoss) / range) * (lossChart.height - 20) - 10;
                if (index === 0) {
                    lossCtx.moveTo(x, y);
                } else {
                    lossCtx.lineTo(x, y);
                }
            });
            lossCtx.stroke();
        }
        
        function connectStream() {
            if (reconnectAttempts >= maxReconnectAttempts) {
                addLog(`达到最大重连次数 (${maxReconnectAttempts})，停止尝试`);
                isTraining = false;
                document.getElementById('startBtn').disabled = false;
                setConnectionStatus('disconnected');
                return;
            }
            
            setConnectionStatus('connecting');
            addLog(`建立连接... (尝试 ${reconnectAttempts + 1}/${maxReconnectAttempts})`);
            
            eventSource = new EventSource('/train-stream');
            
            eventSource.onopen = function() {
                addLog('连接已建立');
                setConnectionStatus('connected');
                reconnectAttempts = 0;
            };
            
            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.status === 'training') {
                        document.getElementById('epoch').textContent = data.epoch;
                        document.getElementById('loss').textContent = data.loss.toFixed(6);
                        document.getElementById('progressBar').style.width = (data.epoch / 2000 * 100) + '%';
                        
                        losses.push(data.loss);
                        if (losses.length > 100) losses.shift();
                        drawLossChart();
                    } else if (data.status === 'completed') {
                        addLog('训练完成，正在绘制计算图...');
                        layoutGraph(data.graphData);
                        
                        document.getElementById('nodeCount').textContent = nodes.length;
                        document.getElementById('edgeCount').textContent = edges.length;
                        document.getElementById('progressBar').style.width = '100%';
                        document.getElementById('highlightBtn').disabled = false;
                        
                        addLog(`最终损失: ${losses[losses.length - 1].toFixed(6)}`);
                        addLog(`计算图节点数: ${nodes.length}`);
                        
                        isTraining = false;
                        setConnectionStatus('disconnected');
                        eventSource.close();
                        eventSource = null;
                    }
                } catch (e) {
                    addLog('数据解析错误: ' + e.message);
                }
            };
            
            eventSource.onerror = function(error) {
                addLog(`连接错误: ${error?.message || '未知错误'}`);
                eventSource.close();
                eventSource = null;
                
                if (isTraining && reconnectAttempts < maxReconnectAttempts) {
                    reconnectAttempts++;
                    addLog(`尝试重新连接...`);
                    setTimeout(connectStream, 1000 * Math.pow(2, reconnectAttempts - 1));
                } else {
                    isTraining = false;
                    document.getElementById('startBtn').disabled = false;
                    setConnectionStatus('disconnected');
                    addLog('连接已断开');
                }
            };
        }
        
        function startTraining() {
            if (isTraining) return;
            
            isTraining = true;
            reconnectAttempts = 0;
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('highlightBtn').disabled = true;
            highlightedNodeIds.clear();
            losses = [];
            nodes = [];
            edges = [];
            
            document.getElementById('canvasHint').style.display = 'none';
            addLog('开始训练异或门网络...');
            
            connectStream();
        }
        
        canvas.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            let found = false;
            for (const node of nodes) {
                const distance = Math.sqrt((node.x - x) ** 2 + (node.y - y) ** 2);
                const radius = isNodeHighlighted(node.id) ? 22 : 15;
                
                if (distance < radius) {
                    hoveredNodeId = node.id;
                    showNodeInfo(node, event);
                    found = true;
                    break;
                }
            }
            
            if (!found) {
                hoveredNodeId = null;
                document.getElementById('nodeInfo').style.display = 'none';
            }
        });
        
        function showNodeInfo(node, event) {
            const info = document.getElementById('nodeInfo');
            info.style.display = 'block';
            
            let infoX = event.clientX + 15;
            let infoY = event.clientY + 15;
            
            if (infoX + 220 > window.innerWidth) infoX = event.clientX - 235;
            if (infoY + 100 > window.innerHeight) infoY = event.clientY - 115;
            
            info.style.left = infoX + 'px';
            info.style.top = infoY + 'px';
            
            document.getElementById('infoLabel').textContent = node.label || '无标签';
            document.getElementById('infoData').textContent = node.data !== undefined ? node.data.toFixed(4) : 'N/A';
            document.getElementById('infoGrad').textContent = node.grad !== undefined ? node.grad.toFixed(4) : 'N/A';
            document.getElementById('infoOp').textContent = node.op || '无';
        }
        
        setConnectionStatus('disconnected');
        drawGraph();
    </script>
</body>
</html>
