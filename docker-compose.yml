version: '3.8'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:3001
      - NODE_ENV=production
    depends_on:
      - recommendation-service
    networks:
      - app-network
    restart: unless-stopped

  recommendation-service:
    build:
      context: ./recommendation-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - gateway
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
